<!doctype html>
<html>
  <head>
    <title>Response Body Test</title>
  </head>
  <body>
    <h1>Response Body Test</h1>
    <button onclick="testResponse()">Test Response Handling</button>
    <pre id="result"></pre>

    <script>
      async function testResponse() {
        const resultEl = document.getElementById("result");
        resultEl.textContent = "Testing...";

        try {
          // Test the new approach - read as text first
          const response = await fetch("/api/ping");
          const responseText = await response.text();

          console.log("Response status:", response.status);
          console.log("Response text:", responseText);

          if (!response.ok) {
            throw new Error(`Failed: ${response.status}`);
          }

          const data = JSON.parse(responseText);
          resultEl.textContent = `✅ Success!\nStatus: ${response.status}\nData: ${JSON.stringify(data, null, 2)}`;
        } catch (error) {
          console.error("Error:", error);
          resultEl.textContent = `❌ Error: ${error.message}`;
        }
      }
    </script>
  </body>
</html>
